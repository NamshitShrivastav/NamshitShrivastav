<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Namshit Shrivastav. I build small, focused software for desktop and the web.">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E2A0"/><stop offset=".45" stop-color="#D4AF37"/><stop offset="1" stop-color="#8C6D1F"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4AF37"/><stop offset=".7" stop-color="#D4AF37" stop-opacity=".45"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF6D6" stop-opacity="0"/><stop offset=".5" stop-color="#FFF6D6"/><stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="850" cy="140" r="280" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D4AF37" stop-opacity=".22"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
    <style>
      .sweep { animation: slide 7s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 55% { transform: translateX(440px); opacity: 1; } 70%,100% { transform: translateX(480px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .sweep { animation: none; opacity: 0; } }
    </style>
  </defs>
  <rect width="1000" height="280" rx="8" fill="#000000"/>
  <rect width="1000" height="280" rx="8" fill="url(#glow)"/>
  <rect x="14" y="14" width="972" height="252" rx="4" fill="none" stroke="#D4AF37" stroke-opacity=".28"/>
  <g fill="none" stroke="#D4AF37" transform="translate(850 140)">
    <rect x="-92" y="-92" width="184" height="184" transform="rotate(45)" stroke-opacity=".18"/>
    <rect x="-68" y="-68" width="136" height="136" transform="rotate(45)" stroke-opacity=".28"/>
    <rect x="-44" y="-44" width="88" height="88" transform="rotate(45)" stroke-opacity=".45"/>
    <rect x="-20" y="-20" width="40" height="40" transform="rotate(45)" stroke-opacity=".75"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke-opacity=".16"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke-opacity=".16"/>
    <circle r="3" fill="#D4AF37" stroke="none"/>
  </g>
  <text x="64" y="132" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="58" fill="url(#metal)" letter-spacing="1">Namshit Shrivastav</text>
  <rect x="64" y="156" width="520" height="1.5" fill="url(#rule)"/>
  <rect class="sweep" x="64" y="155.5" width="90" height="2.5" fill="url(#sweep)"/>
  <text x="64" y="198" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#A8A08C">I build small, focused software for desktop and the web.</text>
  <text x="64" y="228" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#B8962E">Currently building JEE Guard, a focus tool for exam aspirants.</text>
</svg>
